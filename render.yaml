services:
  - type: web
    name: verifai
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 8000
      - key: PRIMARY_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: FALLBACK_MODEL
        value: poolside/laguna-xs-2.1
      - key: REVIEW_FALLBACK_MODEL
        value: openai/gpt-oss-20b
