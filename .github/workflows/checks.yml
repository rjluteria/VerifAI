name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: python -m pip install ruff==0.16.10
      - run: ruff check backend tests scripts --select F,I
      - run: ruff format --check backend tests scripts
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ matrix.os }}
          path: dist/*.zip
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t verifai .
