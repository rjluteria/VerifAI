name: Checks
on: [push, pull_request]
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m unittest discover -s tests -v
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: python -m pip install ruff==0.16.10
      - run: ruff check backend tests scripts --select F,I
      - run: ruff format --check backend tests scripts
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: dist/*.zip
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t verifai .
